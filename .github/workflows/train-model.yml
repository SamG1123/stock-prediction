name: Train research model

on:
  workflow_dispatch:
    inputs:
      cutoff:
        description: "Holdout cutoff (YYYY-MM-DD); blank uses one year ago"
        required: false
        type: string
  schedule:
    # Train after official collection; daily README publication runs afterwards.
    - cron: "0 13 * * 1-5"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model dependencies
        run: pip install .
      - name: Train only when official prices are present
        run: |
          if [ ! -d data/raw/nse_bhavcopy ] || ! find data/raw/nse_bhavcopy -type f \( -name '*.zip' -o -name '*.csv' \) | grep -q .; then
            echo "No NSE price inputs are committed yet; training intentionally skipped."
            exit 0
          fi
          what-moves-india ingest-prices
          what-moves-india ingest-news
          what-moves-india ingest-disclosures
          CUTOFF="${{ inputs.cutoff }}"
          CUTOFF="${CUTOFF:-$(date -u -d '365 days ago' +%F)}"
          what-moves-india train --cutoff "$CUTOFF"
      - name: Retain model report
        uses: actions/upload-artifact@v4
        with:
          name: model-output-${{ github.run_id }}
          path: data/outputs/
          if-no-files-found: ignore
      - name: Commit validated model outputs
        run: |
          if [ ! -d data/outputs ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/outputs
          git diff --cached --quiet || git commit -m "model: refresh research outputs"
          git push
