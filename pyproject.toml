[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "what-moves-india"
version = "0.1.0"
description = "Leakage-aware NSE stock-movement research pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "requests>=2.31",
  "scikit-learn>=1.4",
  "joblib>=1.3",
]

[project.scripts]
what-moves-india = "what_moves_india.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
